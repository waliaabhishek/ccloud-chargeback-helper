logging:
  level: INFO

features:
  enable_periodic_refresh: false

api:
  host: "0.0.0.0"
  port: 8080

tenants:
  clean-confluent:
    ecosystem: confluent_cloud
    tenant_id: northstar-confluent
    lookback_days: 200
    cutoff_days: 5
    storage:
      backend: sqlmodel
      connection_string: "sqlite:////app/data/chargeback.db"
    plugin_settings:
      ccloud_api:
        key: "demo-placeholder-key"
        secret: "demo-placeholder-secret"  # pragma: allowlist secret
      topic_attribution:
        enabled: false
